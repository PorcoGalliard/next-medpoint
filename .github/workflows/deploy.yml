name: Deploy to Vercel

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"

      - name: Configure Git for Gitea access
        run: git config --global url."https://${{ secrets.GITEA_TOKEN }}@gitea.sev-2.com".insteadOf ssh://gitea.sev-2.com

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pull Vercel configuration
        run: npx vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build application with Vercel
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Copy required node_modules to output
        run: |
          mkdir -p .vercel/output/functions/node_modules
          cp -r node_modules/next .vercel/output/functions/node_modules/
          cp -r node_modules/jekoneng-web-ui .vercel/output/functions/node_modules/

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod --prebuilt"
