name: Deploy to Vercel

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "yarn"

      - name: Configure Git for Gitea access
        run: git config --global url."https://${{ secrets.GITEA_TOKEN }}@gitea.sev-2.com".insteadOf ssh://gitea.sev-2.com

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Create Vercel output structure
        run: |
          mkdir -p .vercel/output/functions/index.func
          mkdir -p .vercel/output/static

          # Copy standalone server into function directory
          cp -r .next/standalone/* .vercel/output/functions/index.func/

          # Create function config
          cat > .vercel/output/functions/index.func/.vc-config.json << 'EOF'
          {
            "runtime": "nodejs18.x",
            "handler": "server.js",
            "launcherType": "Nodejs"
          }
          EOF

          # Copy static assets
          cp -r .next/static .vercel/output/static/_next
          cp -r public/* .vercel/output/static/ 2>/dev/null || true

          # Create config with proper routing
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/_next/static/(.*)$",
                "headers": { "cache-control": "public, max-age=31536000, immutable" },
                "dest": "/static/_next/static/$1"
              },
              {
                "src": "^/(.*)",
                "dest": "/index"
              }
            ]
          }
          EOF

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod --prebuilt"
